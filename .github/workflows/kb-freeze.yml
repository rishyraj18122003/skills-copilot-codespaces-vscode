name: KB Freeze v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build frozen KB
        run: |
          echo "KB Freeze v1"
          echo "Pinned source: MicrosoftDocs/SupportArticles-docs"
          echo "Pinned commit: 899bff3bc0ce59244c9258bd55bdddbf2d94a705"
          echo "Run the dissertation KB build from the repository checkout with the pinned build specification in Supporting/KB_Freeze_Spec_v1.md."
          test -d .
