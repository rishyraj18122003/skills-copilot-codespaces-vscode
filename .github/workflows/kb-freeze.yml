name: KB Freeze v1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sentence-transformers==3.0.1" "numpy<3" pandas

      - name: Build frozen KB and embeddings
        env:
          SOURCE_REPO: MicrosoftDocs/SupportArticles-docs
          SOURCE_COMMIT: 899bff3bc0ce59244c9258bd55bdddbf2d94a705
          EXPECTED_MODEL_SHA256: 53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db
        run: |
          cat > build_kb.py <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          import numpy as np
          from sentence_transformers import SentenceTransformer
          from huggingface_hub import snapshot_download

          SOURCE_REPO = os.environ["SOURCE_REPO"]
          SOURCE_COMMIT = os.environ["SOURCE_COMMIT"]
          EXPECTED_MODEL_SHA256 = os.environ["EXPECTED_MODEL_SHA256"]

          ROOTS = {
              "Windows": Path("support/windows-client"),
              "Outlook": Path("Outlook"),
              "Teams": Path("Teams"),
              "Microsoft365": Path("Microsoft365"),
          }

          INCLUDE_RE = re.compile(
              r"(troubleshoot|troubleshooting|error|issue|problem|cannot|can't|unable|"
              r"missing|fails?|failure|not[- ]working|sync|sign[- ]in|login|"
              r"password|attachment|recording|search|crash|freeze|hang|connect)",
              re.I,
          )

          EXCLUDE_RE = re.compile(
              r"(^|/)(admin|developer|dev|authoring|templates?)(/|$)|"
              r"(toc|index)[^/]*\.md$",
              re.I,
          )

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def parse_frontmatter(text: str) -> tuple[dict[str, str], str]:
              meta: dict[str, str] = {}
              if not text.startswith("---"):
                  return meta, text
              parts = text.split("---", 2)
              if len(parts) != 3:
                  return meta, text
              raw = parts[1]
              body = parts[2]
              current = None
              for line in raw.splitlines():
                  if not line.strip():
                      continue
                  if line.startswith("  ") and current:
                      meta[current] = (meta.get(current, "") + " " + line.strip()).strip()
                      continue
                  if ":" in line and not line.startswith(("-", " ")):
                      k, v = line.split(":", 1)
                      current = k.strip()
                      meta[current] = v.strip().strip('"')
              return meta, body

          def clean_body(body: str) -> str:
              body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
              body = re.sub(r":::\w+.*?(?=\n|$)", "", body)
              body = re.sub(r"\{:[^}]+\}", "", body)
              body = re.sub(r"\n{3,}", "\n\n", body)
              return body.strip()

          def family_for(rel: Path) -> str:
              p = rel.as_posix().lower()
              if p.startswith("outlook/"):
                  return "Outlook"
              if p.startswith("teams/"):
                  return "Teams"
              if p.startswith("microsoft365/"):
                  return "Microsoft365"
              return "Windows"

          def score_article(rel: Path, meta: dict[str, str], body: str) -> float:
              title = meta.get("title", "")
              desc = meta.get("description", "")
              audience = meta.get("audience", "")
              topic = meta.get("ms.topic", "").lower()
              score = 0.0
              if topic == "troubleshooting":
                  score += 10
              if INCLUDE_RE.search(title):
                  score += 5
              if INCLUDE_RE.search(desc):
                  score += 3
              if re.search(r"(^|\s)(end user|user|consumer)(\s|$)", audience, re.I):
                  score += 3
              if re.search(r"ITPro|admin|administrator", audience, re.I):
                  score -= 2
              if EXCLUDE_RE.search(rel.as_posix()):
                  score -= 8
              if re.search(r"(^|\n)##?\s+(symptoms|cause|resolution|workaround|troubleshoot)", body, re.I):
                  score += 2
              score += min(len(body) / 20000.0, 2.0)
              return score

          def largest_remainder_quotas(counts: dict[str, int], total: int) -> dict[str, int]:
              s = sum(counts.values())
              raw = {k: total * v / s for k, v in counts.items()}
              q = {k: int(v) for k, v in raw.items()}
              remain = total - sum(q.values())
              order = sorted(raw, key=lambda k: (raw[k] - q[k], k), reverse=True)
              for k in order[:remain]:
                  q[k] += 1
              return q

          repo = Path("src_repo")
          subprocess.run(
              ["git", "clone", "--quiet", "--no-tags", "--filter=blob:none",
               "https://github.com/MicrosoftDocs/SupportArticles-docs.git", str(repo)],
              check=True,
          )
          subprocess.run(["git", "-C", str(repo), "checkout", "--quiet", SOURCE_COMMIT], check=True)

          raw_counts = {}
          for fam, root in ROOTS.items():
              raw_counts[fam] = sum(1 for _ in (repo / root).rglob("*.md")) if (repo / root).exists() else 0
          quotas = largest_remainder_quotas(raw_counts, 200)

          candidates = {fam: [] for fam in ROOTS}
          duplicate_hashes = set()

          for fam, root in ROOTS.items():
              root_dir = repo / root
              if not root_dir.exists():
                  continue
              for path in sorted(root_dir.rglob("*.md")):
                  rel = path.relative_to(repo)
                  raw = path.read_text(encoding="utf-8", errors="replace")
                  meta, body = parse_frontmatter(raw)
                  body = clean_body(body)
                  title = meta.get("title", "").strip()
                  desc = meta.get("description", "").strip()
                  topic = meta.get("ms.topic", "").strip().lower()

                  if path.name.lower() in {"index.md", "toc.md"}:
                      continue
                  if EXCLUDE_RE.search(rel.as_posix()):
                      continue
                  if len(body) < 300:
                      continue
                  if topic != "troubleshooting" and not INCLUDE_RE.search(title + " " + desc + " " + body[:2000]):
                      continue

                  h = sha256_bytes(body.encode("utf-8"))
                  if h in duplicate_hashes:
                      continue
                  duplicate_hashes.add(h)

                  blob_sha = subprocess.check_output(
                      ["git", "-C", str(repo), "rev-parse", f"{SOURCE_COMMIT}:{rel.as_posix()}"],
                      text=True,
                  ).strip()

                  candidates[fam].append({
                      "rel": rel.as_posix(),
                      "title": title,
                      "description": desc,
                      "topic": topic,
                      "audience": meta.get("audience", "").strip(),
                      "ms_date": meta.get("ms.date", "").strip(),
                      "score": score_article(rel, meta, body),
                      "content": body,
                      "content_sha256": h,
                      "git_blob_sha": blob_sha,
                  })

          selected = []
          for fam, items in candidates.items():
              items.sort(key=lambda x: (-x["score"], x["rel"]))
              selected.extend([{**x, "product_family": fam} for x in items[:quotas[fam]]])

          # Fill any family quota deficit deterministically from remaining candidates.
          selected_paths = {x["rel"] for x in selected}
          if len(selected) < 200:
              remainder = []
              for fam, items in candidates.items():
                  for x in items:
                      if x["rel"] not in selected_paths:
                          remainder.append({**x, "product_family": fam})
              remainder.sort(key=lambda x: (-x["score"], x["product_family"], x["rel"]))
              selected.extend(remainder[:200-len(selected)])

          selected.sort(key=lambda x: (x["product_family"], x["rel"]))
          out = Path("kb_freeze")
          content_dir = out / "kb_content"
          content_dir.mkdir(parents=True, exist_ok=True)

          article_rows = []
          unit_rows = []
          all_units = []

          for item in selected:
              kb_id = "KB-" + hashlib.sha1(item["rel"].encode()).hexdigest()[:12].upper()
              article_rows.append({
                  "kb_id": kb_id,
                  "source_path": item["rel"],
                  "source_url": f"https://github.com/{SOURCE_REPO}/blob/{SOURCE_COMMIT}/{item['rel']}",
                  "title": item["title"],
                  "description": item["description"],
                  "product_family": item["product_family"],
                  "topic": item["topic"],
                  "audience": item["audience"],
                  "ms_date": item["ms_date"],
                  "content_sha256": item["content_sha256"],
                  "git_blob_sha": item["git_blob_sha"],
                  "source_commit": SOURCE_COMMIT,
              })

              paragraphs = [p.strip() for p in re.split(r"\n\s*\n", item["content"]) if p.strip()]
              words = " ".join(paragraphs).split()
              max_words = 180
              overlap = 30
              start = 0
              chunk_no = 1
              while start < len(words):
                  end = min(start + max_words, len(words))
                  chunk = " ".join(words[start:end])
                  retrieval_text = f"{item['title']}\n{chunk}"
                  unit_id = f"{kb_id}-C{chunk_no:03d}"
                  unit_rows.append({
                      "unit_id": unit_id,
                      "kb_id": kb_id,
                      "product_family": item["product_family"],
                      "source_path": item["rel"],
                      "chunk_no": chunk_no,
                      "retrieval_text_sha256": sha256_bytes(retrieval_text.encode()),
                      "text_word_count": len(chunk.split()),
                      "retrieval_text": retrieval_text,
                      "content": chunk,
                  })
                  all_units.append(retrieval_text)
                  (content_dir / f"{unit_id}.txt").write_text(chunk, encoding="utf-8")
                  chunk_no += 1
                  if end >= len(words):
                      break
                  start = max(0, end - overlap)

          manifest = {
              "source_repository": SOURCE_REPO,
              "source_commit": SOURCE_COMMIT,
              "article_count": len(article_rows),
              "unit_count": len(unit_rows),
              "raw_article_counts_by_family": raw_counts,
              "quota_by_family": quotas,
              "selected_article_counts_by_family": {
                  fam: sum(1 for x in article_rows if x["product_family"] == fam) for fam in ROOTS
              },
              "selection_method": "deterministic score + source-proportional quota + path tie-break",
              "duplicate_policy": "exact cleaned-content hash deduplication",
              "retrieval_unit_policy": "180-word sliding chunks with 30-word overlap, title prepended",
              "retriever": "sentence-transformers/all-MiniLM-L6-v2",
              "max_seq_length": 256,
              "pooling": "mean",
              "normalized": True,
              "similarity": "cosine",
              "model_hash_expected": EXPECTED_MODEL_SHA256,
          }

          out.mkdir(parents=True, exist_ok=True)
          fields_a = [
              "kb_id","source_path","source_url","title","description","product_family","topic",
              "audience","ms_date","content_sha256","git_blob_sha","source_commit"
          ]
          with (out / "kb_articles_frozen.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=fields_a)
              w.writeheader()
              w.writerows(article_rows)

          fields_u = [
              "unit_id","kb_id","product_family","source_path","chunk_no",
              "retrieval_text_sha256","text_word_count","retrieval_text","content"
          ]
          with (out / "kb_units.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=fields_u)
              w.writeheader()
              w.writerows(unit_rows)

          (out / "kb_manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")

          model_dir = Path("hf_model")
          snapshot_download("sentence-transformers/all-MiniLM-L6-v2", local_dir=str(model_dir))

          model_file = model_dir / "model.safetensors"
          model_hash = sha256_bytes(model_file.read_bytes())
          if model_hash != EXPECTED_MODEL_SHA256:
              raise RuntimeError(f"Model hash mismatch: {model_hash} != {EXPECTED_MODEL_SHA256}")

          cfg = {
              "model": "sentence-transformers/all-MiniLM-L6-v2",
              "model_safetensors_sha256": model_hash,
              "max_seq_length": 256,
              "pooling": "mean",
              "normalize_embeddings": True,
              "similarity": "cosine",
          }
          (out / "model_fingerprint.json").write_text(json.dumps(cfg, indent=2), encoding="utf-8")

          model = SentenceTransformer(str(model_dir))
          model.max_seq_length = 256
          embeddings = model.encode(
              all_units,
              batch_size=64,
              show_progress_bar=True,
              convert_to_numpy=True,
              normalize_embeddings=True,
          ).astype("float32")
          np.save(out / "kb_embeddings_minilm.npy", embeddings)

          with (out / "kb_embedding_manifest.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["unit_id","kb_id","embedding_row","model","model_sha256","max_seq_length",
                          "pooling","normalized","similarity"])
              for i, u in enumerate(unit_rows):
                  w.writerow([
                      u["unit_id"], u["kb_id"], i, "sentence-transformers/all-MiniLM-L6-v2",
                      model_hash, 256, "mean", True, "cosine"
                  ])

          qa = {
              "article_count": len(article_rows),
              "unit_count": len(unit_rows),
              "unique_content_hashes": len(set(x["content_sha256"] for x in article_rows)),
              "duplicate_article_count": len(article_rows) - len(set(x["content_sha256"] for x in article_rows)),
              "near_duplicate_review": "not automatically removed; source-path/title review may be performed",
          }
          (out / "kb_qa.json").write_text(json.dumps(qa, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

          python build_kb.py

      - name: Package KB artifact
        run: |
          tar -czf kb_freeze_artifact.tar.gz kb_freeze
          sha256sum kb_freeze_artifact.tar.gz > kb_freeze_artifact.sha256

      - name: Upload KB freeze artifact
        uses: actions/upload-artifact@v4
        with:
          name: kb-freeze-v1
          path: |
            kb_freeze_artifact.tar.gz
            kb_freeze_artifact.sha256
            kb_freeze/kb_manifest.json
            kb_freeze/kb_qa.json
            kb_freeze/model_fingerprint.json
